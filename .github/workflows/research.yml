name: research

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only use the first N tickers (0 = all)"
        default: "0"
  push:
    branches: [claude/ml-stock-algorithm-amym01]
    paths:
      - "mlalgo/**"
      - "research.py"
      - "requirements.txt"
      - ".github/workflows/research.yml"

permissions:
  contents: write

# One research run at a time; new runs wait in line instead of cancelling the one in progress.
concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # a queued run uses the newest code on the branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Week key for the price cache
        id: week
        run: echo "key=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore price cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: prices-v5-${{ steps.week.outputs.key }}

      - name: Download prices
        run: python research.py --cache data --download-only
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}   # repo variable: "Name email" for SEC EDGAR

      - name: Save price cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/
          key: prices-v5-${{ steps.week.outputs.key }}

      - name: Run research
        run: python research.py --cache data --out results --limit "${{ github.event.inputs.limit || '0' }}"
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}

      - name: Commit results
        run: |
          set -euo pipefail
          BR="${GITHUB_REF_NAME}"
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          rm -rf /tmp/new && mkdir -p /tmp/new && cp -r results/. /tmp/new/
          for i in 1 2 3 4 5; do
            # always commit on top of the latest branch: never conflicts with other runs or edits
            git fetch -q origin "$BR"
            git reset -q --hard "origin/$BR"
            mkdir -p results
            for f in /tmp/new/*; do
              b=$(basename "$f")
              case "$b" in LOG.md|history.csv) ;; *) cp "$f" results/ ;; esac
            done
            python - <<'PY'
          import pandas as pd, pathlib
          new = pd.read_csv("/tmp/new/history.csv", dtype={"commit": str}).tail(1)
          p = pathlib.Path("results/history.csv")
          old = pd.read_csv(p, dtype={"commit": str}) if p.exists() else pd.DataFrame()
          pd.concat([old, new], ignore_index=True).to_csv(p, index=False)
          PY
            git add results
            git commit -q -m "Research results $(date -u +%Y-%m-%d) [skip ci]" || { echo "no changes"; exit 0; }
            if git push -q origin "HEAD:$BR"; then echo "results pushed"; exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::could not push research results"
          exit 1

      - name: Upload signals (all trades with features)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signals
          path: |
            data/signals.parquet
            data/superperformer_sample.parquet
          if-no-files-found: ignore
          retention-days: 14
